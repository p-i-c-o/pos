[package]
name = "pos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pos-core = { path = "../../core/pos-core" }
pos-postgres = { path = "../../storage/pos-postgres" }
pos-permissions = { path = "../../core/pos-permissions" }
zeroize = "1.9.1"
rpassword = "7"
pos-tasks = { path = "../../modules/pos-tasks" }
uuid = { version = "1", features = ["serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["postgres"] }
serde_json = "1"
