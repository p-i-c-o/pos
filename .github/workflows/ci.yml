name: Rust workspace CI

on:
  push:
    branches: ["main", "docs/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Smoke test CLI, SQLite Tasks and server
        run: |
          ./target/debug/pos --help | grep -F "interactive terminal UI"
          ./target/debug/pos --version | grep -F "POS 0.0.0"
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks add "CI task" --due 2026-12-17
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --json | grep -F '"title": "CI task"'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks done 1
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all | grep -F '[x] CI task'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects add "CI Project" | grep -F '[ci-project]'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks edit 1 --project ci-project
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all --project ci-project | grep -F 'CI task'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects archive 1
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects list --all | grep -F 'archived'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects delete 1 --yes
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all --json | grep -F '"project_id": null'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data check | grep -F 'integrity and foreign keys OK'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data export --output "$TEST_DIR/records.json"
          grep -F '"format_version": 1' "$TEST_DIR/records.json"
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data backup "$TEST_DIR/backup.sqlite3"
          ./target/debug/pos data restore "$TEST_DIR/backup.sqlite3" --output "$TEST_DIR/recovered.sqlite3"
          ./target/debug/pos --db "$TEST_DIR/recovered.sqlite3" data check | grep -F 'integrity and foreign keys OK'
          ./target/debug/pos --db "$TEST_DIR/recovered.sqlite3" tasks list --all | grep -F 'CI task'
          ./target/debug/pos-server | grep -F "server scaffold"
