name: Rust workspace CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**", "docs/**", "release/**", "hotfix/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: pos_ci_ephemeral_only
          POSTGRES_DB: pos_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos_ci -d pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Validate GitFlow PR target
        if: github.event_name == 'pull_request'
        run: |
          if [ "$GITHUB_BASE_REF" = "main" ]; then
            case "$GITHUB_HEAD_REF" in
              release/*|hotfix/*) ;;
              *)
                echo "::error::PRs to main must originate from release/* or hotfix/*. Target develop instead."
                exit 1
                ;;
            esac
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Test SQLite offline change journal and migration recovery
        run: cargo test -p pos-sqlite --test sync_journal --locked -- --nocapture

      - name: Test PostgreSQL connection, concurrency and migrations
        env:
          POS_TEST_DATABASE_URL: postgres://pos_ci:pos_ci_ephemeral_only@127.0.0.1:5432/pos_ci?sslmode=disable
        run: cargo test -p pos-postgres --test postgres --locked -- --nocapture
      - name: Test user, device and session authentication against PostgreSQL
        env:
          POS_TEST_DATABASE_URL: postgres://pos_ci:pos_ci_ephemeral_only@127.0.0.1:5432/pos_ci?sslmode=disable
        run: cargo test -p pos-postgres --test auth --locked -- --nocapture

      - name: Test authenticated HTTP and cross-user workspace isolation
        env:
          POS_TEST_DATABASE_URL: postgres://pos_ci:pos_ci_ephemeral_only@127.0.0.1:5432/pos_ci?sslmode=disable
        run: cargo test -p pos-server --test authenticated --locked -- --nocapture

      - name: Test authenticated server Tasks/Projects and isolation
        env:
          POS_TEST_DATABASE_URL: postgres://pos_ci:pos_ci_ephemeral_only@127.0.0.1:5432/pos_ci?sslmode=disable
        run: cargo test -p pos-server --test records --locked -- --nocapture

      - name: Test account onboarding and device session revocation
        env:
          POS_TEST_DATABASE_URL: postgres://pos_ci:pos_ci_ephemeral_only@127.0.0.1:5432/pos_ci?sslmode=disable
        run: cargo test -p pos-server --test onboarding --locked -- --nocapture

      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Smoke test CLI, SQLite Tasks and server
        run: |
          ./target/debug/pos --help | grep -F "interactive terminal UI"
          ./target/debug/pos --version | grep -F "POS 0.1.0"
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks add "CI task" --due 2026-12-17
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --json | grep -F '"title": "CI task"'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks done 1
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all | grep -F '[x] CI task'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects add "CI Project" | grep -F '[ci-project]'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks edit 1 --project ci-project
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all --project ci-project | grep -F 'CI task'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects archive 1
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects list --all | grep -F 'archived'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" projects delete 1 --yes
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --all --json | grep -F '"project_id": null'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks edit 1 --priority urgent --status in-progress --description "CI search sentinel"
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --search "search sentinel" --priority urgent --status in-progress | grep -F 'CI task'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" tasks list --sort priority --json | grep -F '"priority": "urgent"'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data check | grep -F 'integrity and foreign keys OK'
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data export --output "$TEST_DIR/records.json"
          grep -F '"format_version": 2' "$TEST_DIR/records.json"
          grep -F '"status": "in-progress"' "$TEST_DIR/records.json"
          ./target/debug/pos --db "$TEST_DIR/tasks.sqlite3" data backup "$TEST_DIR/backup.sqlite3"
          ./target/debug/pos data restore "$TEST_DIR/backup.sqlite3" --output "$TEST_DIR/recovered.sqlite3"
          ./target/debug/pos --db "$TEST_DIR/recovered.sqlite3" data check | grep -F 'integrity and foreign keys OK'
          ./target/debug/pos --db "$TEST_DIR/recovered.sqlite3" tasks list --all | grep -F 'CI task'
          ./target/debug/pos-server --version | grep -F "pos-server 0.1.0"

      - name: Smoke test local-only HTTP server and lifecycle
        run: python3 scripts/server-smoke.py ./target/debug/pos-server

      - name: Verify optimized release candidate and safe local installation
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')
        run: |
          bash -n scripts/install-local.sh scripts/release-smoke.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install-local.sh scripts/release-smoke.sh
          fi
          cargo build --release --locked -p pos-cli --bin pos
          bash scripts/release-smoke.sh
          INSTALL_ROOT="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_ROOT"' EXIT
          bash scripts/install-local.sh --prefix "$INSTALL_ROOT"
          "$INSTALL_ROOT/bin/pos" --version | grep -F "POS 0.1.0"
          if bash scripts/install-local.sh --prefix "$INSTALL_ROOT" >/dev/null 2>&1; then
            echo "::error::Installer unexpectedly overwrote existing executable"
            exit 1
          fi
          bash scripts/install-local.sh --prefix "$INSTALL_ROOT" --upgrade
          "$INSTALL_ROOT/bin/pos" --version | grep -F "POS 0.1.0"
          mkdir -p "$INSTALL_ROOT/link-test/bin"
          ln -s /nonexistent "$INSTALL_ROOT/link-test/bin/pos"
          if bash scripts/install-local.sh --prefix "$INSTALL_ROOT/link-test" >/dev/null 2>&1; then
            echo "::error::Installer unexpectedly replaced a symlink"
            exit 1
          fi
