[package]
name = "pos-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pos-auth = { path = "../../core/pos-auth" }
pos-permissions = { path = "../../core/pos-permissions" }
pos-projects = { path = "../../modules/pos-projects" }
pos-tasks = { path = "../../modules/pos-tasks" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["serde"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
