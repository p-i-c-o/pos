[package]
name = "pos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pos"
path = "src/main.rs"

[dependencies]
pos-core = { path = "../../core/pos-core" }
pos-tui = { path = "../pos-tui" }
pos-tasks = { path = "../../modules/pos-tasks" }
pos-projects = { path = "../../modules/pos-projects" }
pos-sqlite = { path = "../../storage/pos-sqlite" }
clap = { version = "4.5.53", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
